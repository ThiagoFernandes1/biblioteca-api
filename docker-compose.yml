# Sobe o SQL Server e cria o banco BibliotecaDB. As tabelas ficam por conta
# do Flyway, na primeira vez que a API subir.
#
#   docker compose up -d
#   DB_PASSWORD=Biblioteca@2026 mvn spring-boot:run
#
# Se a porta 1433 ja estiver em uso (outro SQL Server local), escolha outra:
#   DB_PORT=1434 docker compose up -d
#   DB_URL="jdbc:sqlserver://localhost:1434;databaseName=BibliotecaDB;encrypt=true;trustServerCertificate=true" ...

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Biblioteca@2026}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - dados:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20

  cria-banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${DB_PASSWORD:-Biblioteca@2026}
      - -b
      - -Q
      - IF DB_ID(N'BibliotecaDB') IS NULL CREATE DATABASE BibliotecaDB
    restart: "no"

volumes:
  dados:
